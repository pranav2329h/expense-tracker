<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Track expenses, income and budgets across all your devices." />
    <meta name="theme-color" content="#f6f6f4" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Expense Tracker</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var preference = localStorage.getItem('expense-tracker:theme') || 'system';
          var dark =
            preference === 'dark' ||
            (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {
          /* storage unavailable: fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Expense Tracker needs JavaScript enabled to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
